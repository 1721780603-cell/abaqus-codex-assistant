[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqus-codex-assistant"
version = "0.2.2a1"
description = "面向 Abaqus 初学者的环境检测、建模、求解、结果读取与中文报告工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "1721780603-cell and Abaqus Codex Assistant contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.scripts]
abaqus-codex = "abaqus_codex.cli:main"

[project.gui-scripts]
abaqus-codex-assistant = "abaqus_codex.desktop_assistant:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abaqus_codex = [
    "user_subroutines/*.for.in",
    "assistant_protocol/*.json",
]

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5"]
