name: 功能建议
description: 提议一个适合项目范围的新功能或改进
title: "[Feature] "
body:
  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      options:
        - 环境检测与安装
        - Abaqus 建模
        - 求解与作业管理
        - ODB 后处理
        - 报告生成
        - 论文复现工作流
        - 文档与教学
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户困难，不要只描述实现方式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: beginner_value
    attributes:
      label: 对初学者的价值
      description: 说明它如何降低 Abaqus 学习或复现门槛。
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不要求绕过 Abaqus 许可证、论文付费墙或机构认证。
          required: true
